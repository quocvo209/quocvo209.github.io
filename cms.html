<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageCMS Quản Lý | Quốc Võ Production</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: { 50: '#FAF7F2', 100: '#F3EFE6', 200: '#E8E1D3', 300: '#D6CBBA' },
                        espresso: { 800: '#2A2421', 900: '#1F1A17' },
                        gold: { DEFAULT: '#A37832', light: '#C49747' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF7F2; color: #1F1A17; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-beige-50 text-espresso-900 min-h-screen p-4 md:p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} {...props}></i>;
        };

        function CMSApp() {
            const [projects, setProjects] = useState([]);
            const [btsPhotos, setBtsPhotos] = useState([]);

            // Form state dự án
            const [title, setTitle] = useState('');
            const [category, setCategory] = useState('TVC/MV');
            const [url, setUrl] = useState('');
            const [thumb, setThumb] = useState('');
            const [desc, setDesc] = useState('');

            // Form state BTS
            const [btsUrl, setBtsUrl] = useState('');
            const [btsCaption, setBtsCaption] = useState('');

            useEffect(() => {
                const savedProjects = localStorage.getItem('qv_projects');
                const savedBts = localStorage.getItem('qv_bts');
                if (savedProjects) setProjects(JSON.parse(savedProjects));
                if (savedBts) setBtsPhotos(JSON.parse(savedBts));
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const handleAddProject = (e) => {
                e.preventDefault();
                if (!title || !thumb) return;
                const newItem = {
                    id: Date.now(),
                    title,
                    category,
                    url: url || 'https://www.youtube.com/embed/dQw4w9WgXcQ',
                    thumbnail: thumb,
                    desc
                };
                const updated = [newItem, ...projects];
                setProjects(updated);
                localStorage.setItem('qv_projects', JSON.stringify(updated));
                setTitle(''); setUrl(''); setThumb(''); setDesc('');
                alert('Đã thêm dự án mới thành công!');
            };

            const handleAddBts = (e) => {
                e.preventDefault();
                if (!btsUrl) return;
                const newItem = { id: Date.now(), url: btsUrl, caption: btsCaption || 'Hậu trường quay phim' };
                const updated = [newItem, ...btsPhotos];
                setBtsPhotos(updated);
                localStorage.setItem('qv_bts', JSON.stringify(updated));
                setBtsUrl(''); setBtsCaption('');
                alert('Đã thêm ảnh hậu trường thành công!');
            };

            const deleteProject = (id) => {
                if (confirm('Bạn có chắc muốn xóa dự án này?')) {
                    const updated = projects.filter(p => p.id !== id);
                    setProjects(updated);
                    localStorage.setItem('qv_projects', JSON.stringify(updated));
                }
            };

            const deleteBts = (id) => {
                if (confirm('Bạn có chắc muốn xóa ảnh hậu trường này?')) {
                    const updated = btsPhotos.filter(b => b.id !== id);
                    setBtsPhotos(updated);
                    localStorage.setItem('qv_bts', JSON.stringify(updated));
                }
            };

            return (
                <div className="max-w-5xl mx-auto bg-white rounded-3xl p-6 md:p-10 shadow-xl border border-beige-200">
                    <div className="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-beige-200 gap-4 mb-8">
                        <div>
                            <h1 className="text-2xl md:text-3xl font-extrabold flex items-center gap-3">
                                <Icon name="settings" className="w-8 h-8 text-gold" /> PageCMS Quản Lý Portfolio
                            </h1>
                            <p className="text-sm text-espresso-800/70 mt-1">Đăng bài, cập nhật video dự án & ảnh hậu trường trực tiếp lên trang chủ index.html</p>
                        </div>
                        <a href="index.html" target="_blank" className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-espresso-900 text-beige-50 hover:bg-gold transition-colors text-sm font-semibold">
                            <Icon name="external-link" className="w-4 h-4" /> Xem trang web thực tế
                        </a>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                        {/* Cột trái: Đăng dự án mới */}
                        <div className="space-y-6">
                            <form onSubmit={handleAddProject} className="bg-beige-50 p-6 rounded-2xl border border-beige-200 space-y-4">
                                <h2 className="text-lg font-bold flex items-center gap-2 text-gold">
                                    <Icon name="plus-circle" className="w-5 h-5" /> Thêm Dự Án Video Mới
                                </h2>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Tên dự án *</label>
                                    <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="TVC Mới 2026..." className="w-full px-4 py-2 rounded-xl border border-beige-300 text-sm focus:outline-none focus:border-gold" required />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Danh mục</label>
                                        <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-4 py-2 rounded-xl border border-beige-300 text-sm focus:outline-none focus:border-gold">
                                            <option value="TVC/MV">TVC/MV</option>
                                            <option value="Color Grading">Color Grading</option>
                                            <option value="Reels/TikTok">Reels/TikTok</option>
                                            <option value="ADS">ADS</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Link Ảnh Thumbnail *</label>
                                        <input type="url" value={thumb} onChange={e => setThumb(e.target.value)} placeholder="https://..." className="w-full px-4 py-2 rounded-xl border border-beige-300 text-sm focus:outline-none focus:border-gold" required />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Link Embed Video (YouTube Embed URL)</label>
                                    <input type="url" value={url} onChange={e => setUrl(e.target.value)} placeholder="https://www.youtube.com/embed/..." className="w-full px-4 py-2 rounded-xl border border-beige-300 text-sm focus:outline-none focus:border-gold" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Mô tả dự án</label>
                                    <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="Nội dung, phần mềm sử dụng..." className="w-full px-4 py-2 rounded-xl border border-beige-300 text-sm focus:outline-none focus:border-gold h-20"></textarea>
                                </div>
                                <button type="submit" className="w-full py-3 rounded-xl bg-espresso-900 text-beige-50 font-semibold hover:bg-gold transition-colors text-sm">
                                    Đăng Dự Án Lên Web
                                </button>
                            </form>

                            {/* Danh sách dự án hiện có */}
                            <div className="bg-beige-50 p-6 rounded-2xl border border-beige-200">
                                <h3 className="font-bold text-base mb-4">Danh Sách Dự Án Đang Có ({projects.length})</h3>
                                <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                                    {projects.map(p => (
                                        <div key={p.id} className="p-3 bg-white rounded-xl border border-beige-200 flex items-center justify-between gap-3">
                                            <img src={p.thumbnail} className="w-12 h-12 object-cover rounded-lg" alt="" />
                                            <div className="flex-grow min-w-0">
                                                <p className="font-semibold text-sm truncate">{p.title}</p>
                                                <span className="text-xs text-gold font-medium">{p.category}</span>
                                            </div>
                                            <button onClick={() => deleteProject(p.id)} className="text-red-500 hover:text-red-700 p-2">
                                                <Icon name="trash-2" className="w-4 h-4" />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Cột phải: Đăng ảnh BTS */}
                        <div className="space-y-6">
                            <form onSubmit={handleAddBts} className="bg-beige-50 p-6 rounded-2xl border border-beige-200 space-y-4">
                                <h2 className="text-lg font-bold flex items-center gap-2 text-gold">
                                    <Icon name="image" className="w-5 h-5" /> Thêm Ảnh Hậu Trường (BTS)
                                </h2>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Link Hình Ảnh Hậu Trường *</label>
                                    <input type="url" value={btsUrl} onChange={e => setBtsUrl(e.target.value)} placeholder="https://..." className="w-full px-4 py-2 rounded-xl border border-beige-300 text-sm focus:outline-none focus:border-gold" required />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Chú thích ảnh</label>
                                    <input type="text" value={btsCaption} onChange={e => setBtsCaption(e.target.value)} placeholder="Set up máy quay tại..." className="w-full px-4 py-2 rounded-xl border border-beige-300 text-sm focus:outline-none focus:border-gold" />
                                </div>
                                <button type="submit" className="w-full py-3 rounded-xl bg-espresso-900 text-beige-50 font-semibold hover:bg-gold transition-colors text-sm">
                                    Đăng Ảnh BTS
                                </button>
                            </form>

                            {/* Danh sách ảnh BTS hiện có */}
                            <div className="bg-beige-50 p-6 rounded-2xl border border-beige-200">
                                <h3 className="font-bold text-base mb-4">Ảnh Hậu Trường Hiện Có ({btsPhotos.length})</h3>
                                <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                                    {btsPhotos.map(b => (
                                        <div key={b.id} className="p-3 bg-white rounded-xl border border-beige-200 flex items-center justify-between gap-3">
                                            <img src={b.url} className="w-12 h-12 object-cover rounded-lg" alt="" />
                                            <p className="font-medium text-xs text-espresso-800 flex-grow truncate">{b.caption}</p>
                                            <button onClick={() => deleteBts(b.id)} className="text-red-500 hover:text-red-700 p-2">
                                                <Icon name="trash-2" className="w-4 h-4" />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<CMSApp />);
    </script>
</body>
</html>
