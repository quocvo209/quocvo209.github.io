<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quốc Võ Production | Portfolio & Videographer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: { 50: '#FAF7F2', 100: '#F3EFE6', 200: '#E8E1D3', 300: '#D6CBBA' },
                        espresso: { 800: '#2A2421', 900: '#1F1A17' },
                        gold: { DEFAULT: '#A37832', light: '#C49747' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF7F2; color: #1F1A17; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-beige-50 text-espresso-900 antialiased selection:bg-gold selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} {...props}></i>;
        };

        // Hàm trích xuất ID YouTube chuẩn xác từ link thông thường
        const parseYoutubeUrl = (inputUrl) => {
            if (!inputUrl) return { embedUrl: '' };
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = inputUrl.match(regExp);
            if (match && match[2].length === 11) {
                const videoId = match[2];
                return {
                    embedUrl: `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1`
                };
            }
            return { embedUrl: inputUrl };
        };

        const defaultProjects = [
            { id: 1, title: 'TVC Định vị niềng răng', category: 'TVC/MV', url: 'https://www.youtube-nocookie.com/embed/O9uyMBMOFgU?rel=0', thumbnail: 'https://img.youtube.com/vi/O9uyMBMOFgU/hqdefault.jpg', desc: 'Sản phẩm TVC quảng cáo nha khoa chuyên nghiệp.' },
            { id: 2, title: 'Beauty Lookbook - Glamourous Skin', category: 'Color Grading', url: 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ', thumbnail: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=1200', desc: 'Thế mạnh chuyên sâu Color Grading beauty, giữ tone da mịn màng, trong trẻo.' },
            { id: 3, title: 'TikTok Viral Reel - Fashion Brand', category: 'Reels/TikTok', url: 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ', thumbnail: 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&q=80&w=1200', desc: 'Video ngắn xu hướng, sound design bắt tai, giữ chân người xem cao.' }
        ];

        const defaultBts = [
            { id: 1, url: 'https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?auto=format&fit=crop&q=80&w=800', caption: 'Set up góc máy quay MV tại studio' },
            { id: 2, url: 'https://images.unsplash.com/photo-1574717025055-7e214d648439?auto=format&fit=crop&q=80&w=800', caption: 'Hậu trường cân chỉnh màu sắc DaVinci Resolve' }
        ];

        function App() {
            const [projects, setProjects] = useState([]);
            const [btsPhotos, setBtsPhotos] = useState([]);
            const [activeCategory, setActiveCategory] = useState('All');
            const [selectedProject, setSelectedProject] = useState(null);
            const [sliderPos, setSliderPos] = useState(50);
            
            // CMS States & Auth
            const [showCmsModal, setShowCmsModal] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            // CMS Form states
            const [title, setTitle] = useState('');
            const [category, setCategory] = useState('TVC/MV');
            const [videoInput, setVideoInput] = useState('');
            const [thumbnailBase64, setThumbnailBase64] = useState('');
            const [desc, setDesc] = useState('');

            const [btsUrl, setBtsUrl] = useState('');
            const [btsCaption, setBtsCaption] = useState('');

            const ADMIN_PASSWORD = 'uyendan2026';

            useEffect(() => {
                const savedProjects = localStorage.getItem('qv_projects');
                const savedBts = localStorage.getItem('qv_bts');

                if (savedProjects) setProjects(JSON.parse(savedProjects));
                else { setProjects(defaultProjects); localStorage.setItem('qv_projects', JSON.stringify(defaultProjects)); }

                if (savedBts) setBtsPhotos(JSON.parse(savedBts));
                else { setBtsPhotos(defaultBts); localStorage.setItem('qv_bts', JSON.stringify(defaultBts)); }
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const categories = ['All', 'TVC/MV', 'Color Grading', 'Reels/TikTok', 'ADS'];
            const filteredProjects = activeCategory === 'All' ? projects : projects.filter(p => p.category === activeCategory);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === ADMIN_PASSWORD) {
                    setIsLoggedIn(true);
                    setLoginError('');
                } else {
                    setLoginError('Mật khẩu không chính xác!');
                }
            };

            // Xử lý chọn file ảnh từ máy tính cho Thumbnail
            const handleThumbFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setThumbnailBase64(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddProject = (e) => {
                e.preventDefault();
                if (!title || !videoInput || !thumbnailBase64) {
                    alert('Vui lòng điền đủ tên, link YouTube và tải lên ảnh Thumbnail từ máy tính!');
                    return;
                }

                const { embedUrl } = parseYoutubeUrl(videoInput);

                const newItem = {
                    id: Date.now(),
                    title,
                    category,
                    url: embedUrl || videoInput,
                    thumbnail: thumbnailBase64,
                    desc
                };

                const updated = [newItem, ...projects];
                setProjects(updated);
                localStorage.setItem('qv_projects', JSON.stringify(updated));
                setTitle(''); setVideoInput(''); setThumbnailBase64(''); setDesc('');
                alert('Đã thêm dự án mới thành công!');
            };

            const handleAddBts = (e) => {
                e.preventDefault();
                if (!btsUrl) return;
                const newItem = { id: Date.now(), url: btsUrl, caption: btsCaption || 'Hậu trường quay phim' };
                const updated = [newItem, ...btsPhotos];
                setBtsPhotos(updated);
                localStorage.setItem('qv_bts', JSON.stringify(updated));
                setBtsUrl(''); setBtsCaption('');
                alert('Đã thêm ảnh hậu trường thành công!');
            };

            const deleteProject = (id) => {
                if (confirm('Bạn có chắc muốn xóa dự án này?')) {
                    const updated = projects.filter(p => p.id !== id);
                    setProjects(updated);
                    localStorage.setItem('qv_projects', JSON.stringify(updated));
                }
            };

            const deleteBts = (id) => {
                if (confirm('Bạn có chắc muốn xóa ảnh này?')) {
                    const updated = btsPhotos.filter(b => b.id !== id);
                    setBtsPhotos(updated);
                    localStorage.setItem('qv_bts', JSON.stringify(updated));
                }
            };

            return (
                <div className="min-h-screen bg-beige-50 text-espresso-900 selection:bg-gold selection:text-white">
                    {/* Header */}
                    <header className="sticky top-0 z-40 bg-beige-50/80 backdrop-blur-md border-b border-beige-200">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <a href="#" className="text-xl md:text-2xl font-bold tracking-tight uppercase">
                                    QUỐC VÕ <span className="text-gold font-normal">PRODUCTION</span>
                                </a>
                                <button onClick={() => setShowCmsModal(true)} className="text-[10px] text-espresso-800/30 hover:text-gold uppercase tracking-widest px-2 py-1 rounded transition-colors" title="Quản trị viên">
                                    CMS
                                </button>
                            </div>
                            <a href="#contact" className="inline-flex items-center gap-2 text-sm font-semibold px-5 py-2.5 rounded-full bg-espresso-900 text-beige-50 hover:bg-gold transition-colors">
                                <Icon name="phone" className="w-4 h-4" /> Liên hệ
                            </a>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="pt-24 pb-16 px-6 max-w-7xl mx-auto text-center">
                        <div className="inline-block mb-4 px-4 py-1.5 rounded-full bg-beige-200/60 text-gold text-xs md:text-sm font-semibold tracking-widest uppercase">
                            Video Editor & Videographer • 4 Năm Kinh Nghiệm
                        </div>
                        <h1 className="text-4xl md:text-6xl lg:text-7xl font-black tracking-tight max-w-5xl mx-auto leading-tight mb-6 uppercase">
                            QUỐC VÕ PRODUCTION
                        </h1>
                        <p className="text-base md:text-xl text-espresso-800/80 max-w-2xl mx-auto mb-10 leading-relaxed">
                            Chuyên gia Dựng phim & Color Grading Beauty chuyên nghiệp. Ứng dụng kỹ thuật dựng hiện đại kết hợp công nghệ AI tối ưu quy trình sản xuất hình ảnh.
                        </p>
                        <div className="flex flex-wrap justify-center gap-3 max-w-3xl mx-auto">
                            {['Premiere Pro', 'After Effects', 'DaVinci Resolve', 'Photoshop', 'Lightroom', 'CapCut', 'AI Video Tools'].map((tool, idx) => (
                                <span key={idx} className="px-4 py-2 rounded-xl bg-beige-100 border border-beige-200 text-xs md:text-sm font-medium text-espresso-900 shadow-sm">{tool}</span>
                            ))}
                        </div>
                    </section>

                    {/* Projects Gallery */}
                    <section id="portfolio" className="py-16 px-6 max-w-7xl mx-auto">
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6">
                            <div>
                                <h2 className="text-3xl font-bold tracking-tight mb-2">Dự Án Tiêu Biểu</h2>
                                <p className="text-espresso-800/70 text-sm md:text-base">Tuyển tập các sản phẩm TVC, MV, Quảng cáo và Reels/TikTok.</p>
                            </div>
                            <div className="flex flex-wrap gap-2 bg-beige-200/60 p-1.5 rounded-2xl">
                                {categories.map((cat, idx) => (
                                    <button key={idx} onClick={() => setActiveCategory(cat)} className={`px-4 py-2 rounded-xl text-xs md:text-sm font-medium transition-all ${activeCategory === cat ? 'bg-espresso-900 text-beige-50 shadow-md' : 'text-espresso-900 hover:bg-beige-100'}`}>{cat}</button>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
                            {filteredProjects.map((project) => (
                                <div key={project.id} className="group bg-white rounded-2xl overflow-hidden border border-beige-200 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col">
                                    <div className="relative aspect-[16/9] overflow-hidden bg-beige-100 cursor-pointer" onClick={() => setSelectedProject(project)}>
                                        <img src={project.thumbnail} alt={project.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                        <div className="absolute inset-0 bg-espresso-900/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                            <div className="w-14 h-14 rounded-full bg-gold text-white flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                                <Icon name="play" className="w-6 h-6 fill-current" />
                                            </div>
                                        </div>
                                        <span className="absolute top-4 left-4 bg-espresso-900/80 text-beige-50 text-xs font-semibold px-3 py-1 rounded-full backdrop-blur-sm">{project.category}</span>
                                    </div>
                                    <div className="p-6 flex flex-col flex-grow justify-between">
                                        <div>
                                            <h3 className="text-xl font-bold mb-2 group-hover:text-gold transition-colors">{project.title}</h3>
                                            <p className="text-espresso-800/70 text-sm mb-4 leading-relaxed">{project.desc}</p>
                                        </div>
                                        <div className="flex items-center justify-between pt-4 border-t border-beige-100">
                                            <button onClick={() => setSelectedProject(project)} className="text-sm font-semibold text-gold flex items-center gap-1.5 hover:underline">
                                                Xem video chi tiết <Icon name="arrow-right" className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Contact */}
                    <section id="contact" className="py-20 px-6 max-w-4xl mx-auto text-center">
                        <h2 className="text-3xl md:text-4xl font-bold mb-4">Kết Nối Hợp Tác</h2>
                        <p className="text-espresso-800/70 mb-10 max-w-lg mx-auto">Liên hệ trực tiếp qua Zalo hoặc Facebook.</p>
                        <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                            <a href="https://zalo.me/84707068508" target="_blank" rel="noopener noreferrer" className="w-full sm:w-auto inline-flex items-center justify-center gap-3 px-8 py-4 rounded-2xl bg-espresso-900 text-beige-50 font-semibold hover:bg-gold transition-all shadow-lg">
                                <Icon name="message-circle" className="w-5 h-5 text-gold" /> Zalo: +84 707068508
                            </a>
                        </div>
                    </section>

                    {/* Video Player Modal */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 bg-espresso-900/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl overflow-hidden max-w-4xl w-full shadow-2xl border border-beige-200">
                                <div className="p-4 flex items-center justify-between border-b border-beige-200">
                                    <h3 className="font-bold text-lg">{selectedProject.title}</h3>
                                    <button onClick={() => setSelectedProject(null)} className="w-10 h-10 rounded-full bg-beige-100 flex items-center justify-center hover:bg-red-100 hover:text-red-600 transition-colors">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="aspect-[16/9] w-full bg-black">
                                    <iframe 
                                        src={selectedProject.url} 
                                        title={selectedProject.title} 
                                        className="w-full h-full border-0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                        referrerPolicy="strict-origin-when-cross-origin"
                                        allowFullScreen>
                                    </iframe>
                                </div>
                                <div className="p-6">
                                    <span className="inline-block px-3 py-1 rounded-full bg-beige-200 text-xs font-semibold mb-2">{selectedProject.category}</span>
                                    <p className="text-espresso-800/80 text-sm md:text-base">{selectedProject.desc}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CMS Management Modal */}
                    {showCmsModal && (
                        <div className="fixed inset-0 z-50 bg-espresso-900/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl overflow-hidden max-w-2xl w-full shadow-2xl border border-beige-200 max-h-[90vh] flex flex-col">
                                <div className="p-6 flex items-center justify-between border-b border-beige-200 bg-beige-50">
                                    <h3 className="font-bold text-xl flex items-center gap-2"><Icon name="settings" className="w-6 h-6 text-gold" /> Quản Trị PageCMS</h3>
                                    <button onClick={() => setShowCmsModal(false)} className="w-10 h-10 rounded-full bg-beige-200 flex items-center justify-center hover:bg-red-100 hover:text-red-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-6 overflow-y-auto space-y-6">
                                    {!isLoggedIn ? (
                                        <form onSubmit={handleLogin} className="space-y-4 py-8 text-center max-w-sm mx-auto">
                                            <h4 className="font-bold text-lg">Mật Khẩu Quản Trị</h4>
                                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Nhập mật khẩu truy cập..." className="w-full px-4 py-3 rounded-xl border border-beige-300 text-sm text-center" required />
                                            {loginError && <p className="text-xs text-red-500 font-medium">{loginError}</p>}
                                            <button type="submit" className="w-full py-3 rounded-xl bg-espresso-900 text-beige-50 font-semibold hover:bg-gold text-sm">Đăng Nhập</button>
                                        </form>
                                    ) : (
                                        <div className="space-y-6">
                                            <form onSubmit={handleAddProject} className="space-y-4 bg-beige-50 p-6 rounded-2xl border border-beige-200">
                                                <h4 className="font-bold text-base text-gold">Thêm Dự Án Video Mới</h4>
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1">Tên dự án *</label>
                                                    <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="TVC Định vị..." className="w-full px-4 py-2 rounded-xl border text-sm" required />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1">Link YouTube (Chỉ cần copy đường liên kết ngang) *</label>
                                                    <input type="url" value={videoInput} onChange={e => setVideoInput(e.target.value)} placeholder="https://www.youtube.com/watch?v=..." className="w-full px-4 py-2 rounded-xl border text-sm" required />
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1">Danh mục</label>
                                                        <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-4 py-2 rounded-xl border text-sm">
                                                            <option value="TVC/MV">TVC/MV</option>
                                                            <option value="Color Grading">Color Grading</option>
                                                            <option value="Reels/TikTok">Reels/TikTok</option>
                                                            <option value="ADS">ADS</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold mb-1">Ảnh Thumbnail từ máy tính *</label>
                                                        <input type="file" accept="image/*" onChange={handleThumbFileChange} className="w-full px-2 py-1.5 rounded-xl border text-xs bg-white file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-beige-200 file:font-semibold" required />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold mb-1">Mô tả</label>
                                                    <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="Mô tả..." className="w-full px-4 py-2 rounded-xl border text-sm h-16"></textarea>
                                                </div>
                                                <button type="submit" className="w-full py-3 rounded-xl bg-espresso-900 text-beige-50 font-semibold hover:bg-gold text-sm">Đăng Dự Án</button>
                                            </form>

                                            <div className="bg-beige-50 p-6 rounded-2xl border">
                                                <div className="flex justify-between items-center mb-3">
                                                    <h4 className="font-bold text-sm">Danh Sách Dự Án ({projects.length})</h4>
                                                    <button onClick={() => { if(confirm('Reset về mặc định?')) { localStorage.removeItem('qv_projects'); location.reload(); } }} className="text-xs text-red-500 hover:underline">Reset dữ liệu cũ</button>
                                                </div>
                                                <div className="space-y-2 max-h-40 overflow-y-auto">
                                                    {projects.map(p => (
                                                        <div key={p.id} className="flex items-center justify-between bg-white p-2.5 rounded-xl border">
                                                            <div className="flex items-center gap-2 min-w-0">
                                                                <img src={p.thumbnail} className="w-8 h-8 rounded object-cover" />
                                                                <span className="text-xs font-medium truncate">{p.title}</span>
                                                            </div>
                                                            <button onClick={() => deleteProject(p.id)} className="text-red-500 hover:text-red-700 text-xs font-semibold">Xóa</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
