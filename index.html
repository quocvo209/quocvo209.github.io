<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quốc Võ Production | Portfolio & Videographer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: { 50: '#FAF7F2', 100: '#F3EFE6', 200: '#E8E1D3', 300: '#D6CBBA' },
                        espresso: { 800: '#2A2421', 900: '#1F1A17' },
                        gold: { DEFAULT: '#A37832', light: '#C49747' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF7F2; color: #1F1A17; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-beige-50 text-espresso-900 antialiased selection:bg-gold selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} {...props}></i>;
        };

        const parseYoutubeUrl = (inputUrl) => {
            if (!inputUrl) return { embedUrl: '' };
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = inputUrl.match(regExp);
            if (match && match[2].length === 11) {
                const videoId = match[2];
                return {
                    embedUrl: `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1`
                };
            }
            return { embedUrl: inputUrl };
        };

        const defaultCategories = ['TVC/MV', 'Color Grading', 'Reels/TikTok', 'ADS'];

        const defaultProjects = [
            { id: 1, title: 'TVC Định vị niềng răng', category: 'TVC/MV', url: 'https://www.youtube-nocookie.com/embed/O9uyMBMOFgU?rel=0', rawVideoInput: 'https://www.youtube.com/watch?v=O9uyMBMOFgU', thumbnail: 'https://img.youtube.com/vi/O9uyMBMOFgU/hqdefault.jpg', desc: 'Sản phẩm TVC quảng cáo nha khoa chuyên nghiệp.' },
            { id: 2, title: 'Beauty Lookbook - Glamourous Skin', category: 'Color Grading', url: 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ', rawVideoInput: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', thumbnail: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=1200', desc: 'Thế mạnh chuyên sâu Color Grading beauty, giữ tone da mịn màng, trong trẻo.' }
        ];

        const defaultBtsGalleries = [
            { id: 1, title: 'Tác Nghiệp Bối Cảnh Studio', category: 'Lighting & Setup', image: 'https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?auto=format&fit=crop&q=80&w=800', desc: 'Sử dụng hệ thống đèn Amaran & Aputure để setup cinematic lighting.' },
            { id: 2, title: 'Cân Chỉnh Màu Với DaVinci', category: 'Color Grading', image: 'https://images.unsplash.com/photo-1536240478700-b869070f9279?auto=format&fit=crop&q=80&w=800', desc: 'Quy trình hậu kỳ màu sắc chuẩn Color Space cho màn hình điện ảnh & thiết bị di động.' },
            { id: 3, title: 'Quay Ngoại Cảnh & Gimbal Rig', category: 'On-set Camera Operator', image: 'https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&q=80&w=800', desc: 'Ghi hình mượt mà với camera FX30/A7IV kết hợp DJI RS3 Pro.' }
        ];

        function App() {
            const [projects, setProjects] = useState([]);
            const [categories, setCategories] = useState([]);
            const [btsGalleries, setBtsGalleries] = useState([]);
            const [activeCategory, setActiveCategory] = useState('All');
            const [selectedProject, setSelectedProject] = useState(null);
            const [selectedImage, setSelectedImage] = useState(null);
            
            // CMS States & Auth
            const [showCmsModal, setShowCmsModal] = useState(false);
            const [activeCmsTab, setActiveCmsTab] = useState('projects'); // 'projects', 'categories', 'bts'
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            // CMS Video Form States
            const [editingId, setEditingId] = useState(null);
            const [title, setTitle] = useState('');
            const [category, setCategory] = useState('TVC/MV');
            const [videoInput, setVideoInput] = useState('');
            const [thumbnailBase64, setThumbnailBase64] = useState('');
            const [desc, setDesc] = useState('');
            const [newCategoryInput, setNewCategoryInput] = useState('');

            // CMS BTS Form States
            const [editingBtsId, setEditingBtsId] = useState(null);
            const [btsTitle, setBtsTitle] = useState('');
            const [btsCategory, setBtsCategory] = useState('');
            const [btsImageBase64, setBtsImageBase64] = useState('');
            const [btsDesc, setBtsDesc] = useState('');

            const ADMIN_PASSWORD = 'uyendan2026';

            useEffect(() => {
                const savedProjects = localStorage.getItem('qv_projects');
                if (savedProjects) {
                    setProjects(JSON.parse(savedProjects));
                } else {
                    setProjects(defaultProjects);
                    localStorage.setItem('qv_projects', JSON.stringify(defaultProjects));
                }

                const savedCategories = localStorage.getItem('qv_categories');
                if (savedCategories) {
                    setCategories(JSON.parse(savedCategories));
                } else {
                    setCategories(defaultCategories);
                    localStorage.setItem('qv_categories', JSON.stringify(defaultCategories));
                }

                const savedBts = localStorage.getItem('qv_bts');
                if (savedBts) {
                    setBtsGalleries(JSON.parse(savedBts));
                } else {
                    setBtsGalleries(defaultBtsGalleries);
                    localStorage.setItem('qv_bts', JSON.stringify(defaultBtsGalleries));
                }
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const filteredProjects = activeCategory === 'All' 
                ? projects 
                : projects.filter(p => p.category === activeCategory);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === ADMIN_PASSWORD) {
                    setIsLoggedIn(true);
                    setLoginError('');
                } else {
                    setLoginError('Mật khẩu không chính xác!');
                }
            };

            const handleThumbFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setThumbnailBase64(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleBtsImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setBtsImageBase64(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const resetVideoForm = () => {
                setEditingId(null);
                setTitle('');
                setCategory(categories[0] || 'TVC/MV');
                setVideoInput('');
                setThumbnailBase64('');
                setDesc('');
            };

            const resetBtsForm = () => {
                setEditingBtsId(null);
                setBtsTitle('');
                setBtsCategory('');
                setBtsImageBase64('');
                setBtsDesc('');
            };

            const handleEditClick = (project) => {
                setEditingId(project.id);
                setTitle(project.title);
                setCategory(project.category);
                setVideoInput(project.rawVideoInput || project.url);
                setThumbnailBase64(project.thumbnail);
                setDesc(project.desc || '');
            };

            const handleEditBtsClick = (bts) => {
                setEditingBtsId(bts.id);
                setBtsTitle(bts.title);
                setBtsCategory(bts.category || '');
                setBtsImageBase64(bts.image);
                setBtsDesc(bts.desc || '');
            };

            const handleSaveProject = (e) => {
                e.preventDefault();
                if (!title || !videoInput || !thumbnailBase64) {
                    alert('Vui lòng điền đủ tên, link YouTube và chọn ảnh Thumbnail!');
                    return;
                }

                const { embedUrl } = parseYoutubeUrl(videoInput);

                if (editingId) {
                    const updated = projects.map(p => {
                        if (p.id === editingId) {
                            return {
                                ...p,
                                title,
                                category,
                                url: embedUrl || videoInput,
                                rawVideoInput: videoInput,
                                thumbnail: thumbnailBase64,
                                desc
                            };
                        }
                        return p;
                    });
                    setProjects(updated);
                    localStorage.setItem('qv_projects', JSON.stringify(updated));
                    alert('Đã cập nhật dự án thành công!');
                } else {
                    const newItem = {
                        id: Date.now(),
                        title,
                        category,
                        url: embedUrl || videoInput,
                        rawVideoInput: videoInput,
                        thumbnail: thumbnailBase64,
                        desc
                    };
                    const updated = [newItem, ...projects];
                    setProjects(updated);
                    localStorage.setItem('qv_projects', JSON.stringify(updated));
                    alert('Đã thêm dự án mới thành công!');
                }

                resetVideoForm();
            };

            const handleSaveBts = (e) => {
                e.preventDefault();
                if (!btsTitle || !btsImageBase64) {
                    alert('Vui lòng điền tiêu đề và chọn hình ảnh hậu trường!');
                    return;
                }

                if (editingBtsId) {
                    const updated = btsGalleries.map(b => {
                        if (b.id === editingBtsId) {
                            return {
                                ...b,
                                title: btsTitle,
                                category: btsCategory || 'Behind The Scenes',
                                image: btsImageBase64,
                                desc: btsDesc
                            };
                        }
                        return b;
                    });
                    setBtsGalleries(updated);
                    localStorage.setItem('qv_bts', JSON.stringify(updated));
                    alert('Đã cập nhật hình ảnh BTS thành công!');
                } else {
                    const newItem = {
                        id: Date.now(),
                        title: btsTitle,
                        category: btsCategory || 'Behind The Scenes',
                        image: btsImageBase64,
                        desc: btsDesc
                    };
                    const updated = [newItem, ...btsGalleries];
                    setBtsGalleries(updated);
                    localStorage.setItem('qv_bts', JSON.stringify(updated));
                    alert('Đã thêm hình ảnh BTS mới thành công!');
                }

                resetBtsForm();
            };

            const deleteProject = (id) => {
                if (confirm('Bạn có chắc muốn xóa dự án này?')) {
                    const updated = projects.filter(p => p.id !== id);
                    setProjects(updated);
                    localStorage.setItem('qv_projects', JSON.stringify(updated));
                    if (editingId === id) resetVideoForm();
                }
            };

            const deleteBts = (id) => {
                if (confirm('Bạn có chắc muốn xóa ảnh hậu trường này?')) {
                    const updated = btsGalleries.filter(b => b.id !== id);
                    setBtsGalleries(updated);
                    localStorage.setItem('qv_bts', JSON.stringify(updated));
                    if (editingBtsId === id) resetBtsForm();
                }
            };

            const handleAddCategory = (e) => {
                e.preventDefault();
                const trimmed = newCategoryInput.trim();
                if (!trimmed) return;
                if (categories.includes(trimmed)) {
                    alert('Danh mục này đã tồn tại!');
                    return;
                }
                const updated = [...categories, trimmed];
                setCategories(updated);
                localStorage.setItem('qv_categories', JSON.stringify(updated));
                setNewCategoryInput('');
                alert(`Đã thêm danh mục/list mới: "${trimmed}"`);
            };

            const handleDeleteCategory = (catToDelete) => {
                if (confirm(`Bạn có chắc muốn xóa danh mục "${catToDelete}"? Các video thuộc danh mục này vẫn sẽ giữ tên danh mục cũ.`)) {
                    const updated = categories.filter(c => c !== catToDelete);
                    setCategories(updated);
                    localStorage.setItem('qv_categories', JSON.stringify(updated));
                    if (activeCategory === catToDelete) setActiveCategory('All');
                    if (category === catToDelete && updated.length > 0) setCategory(updated[0]);
                }
            };

            return (
                <div className="min-h-screen bg-beige-50 text-espresso-900 selection:bg-gold selection:text-white">
                    {/* Header Nav */}
                    <header className="sticky top-0 z-40 bg-beige-50/80 backdrop-blur-md border-b border-beige-200">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <a href="#" className="text-xl md:text-2xl font-bold tracking-tight uppercase">
                                    QUỐC VÕ <span className="text-gold font-normal">PRODUCTION</span>
                                </a>
                                <button onClick={() => setShowCmsModal(true)} className="text-[10px] text-espresso-800/50 hover:text-gold uppercase tracking-widest px-2.5 py-1 bg-beige-200/60 rounded-full transition-colors flex items-center gap-1 font-semibold" title="Quản trị CMS">
                                    <Icon name="settings" className="w-3 h-3" /> CMS
                                </button>
                            </div>

                            <a href="#contact" className="inline-flex items-center gap-2 text-sm font-semibold px-5 py-2.5 rounded-full bg-espresso-900 text-beige-50 hover:bg-gold transition-colors">
                                <Icon name="phone" className="w-4 h-4" /> Liên hệ
                            </a>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="pt-16 pb-12 px-6 max-w-7xl mx-auto text-center">
                        <div className="inline-block mb-4 px-4 py-1.5 rounded-full bg-beige-200/60 text-gold text-xs md:text-sm font-semibold tracking-widest uppercase">
                            Video Editor & Videographer • 4 Năm Kinh Nghiệm
                        </div>
                        <h1 className="text-4xl md:text-6xl lg:text-7xl font-black tracking-tight max-w-5xl mx-auto leading-tight mb-6 uppercase">
                            QUỐC VÕ PRODUCTION
                        </h1>
                        <p className="text-base md:text-xl text-espresso-800/80 max-w-2xl mx-auto mb-6 leading-relaxed">
                            Chuyên viên Quay - Dựng phim & Color Grading. Ứng dụng kỹ thuật dựng hiện đại kết hợp công nghệ AI tối ưu quy trình sản xuất hình ảnh.
                        </p>
                    </section>

                    {/* About Me Section (Bố cục gọn: Nội dung dính liền phía trên hình ảnh) */}
                    <section id="about" className="py-12 px-6 max-w-4xl mx-auto border-t border-beige-200">
                        <div className="space-y-6">
                            {/* Nội dung giới thiệu */}
                            <div className="space-y-4 text-center sm:text-left">
                                <div className="inline-block px-3 py-1 rounded-md bg-gold/10 text-gold text-xs font-bold uppercase tracking-wider">
                                    Giới thiệu bản thân
                                </div>
                                <h2 className="text-3xl md:text-4xl font-bold tracking-tight">Kể Chuyện Bằng Hình Ảnh & Góc Máy Tinh Tế</h2>
                                <p className="text-espresso-800/80 leading-relaxed">
                                    Chào bạn, mình là <strong>Quốc Võ</strong> — Videographer & Editor tại TP.HCM. Với hơn 4 năm làm việc trong lĩnh vực sản xuất nội dung video, mình tập trung vào việc biến ý tưởng thương hiệu thành những khung hình giàu cảm xúc và thu hút thị giác.
                                </p>
                                
                                {/* Thống kê (Đã bỏ 4K/HDR) */}
                                <div className="grid grid-cols-2 gap-4 pt-2 max-w-md mx-auto sm:mx-0">
                                    <div className="p-4 rounded-2xl bg-white border border-beige-200 shadow-sm text-center">
                                        <h4 className="text-2xl font-black text-gold mb-1">04+</h4>
                                        <p className="text-xs text-espresso-800/70 font-medium">Năm kinh nghiệm</p>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-white border border-beige-200 shadow-sm text-center">
                                        <h4 className="text-2xl font-black text-gold mb-1">100+</h4>
                                        <p className="text-xs text-espresso-800/70 font-medium">Dự án hoàn thành</p>
                                    </div>
                                </div>
                            </div>

                            {/* Hình ảnh giới thiệu dính ngay bên dưới */}
                            <div className="pt-4">
                                <div className="aspect-[16/9] sm:aspect-[21/9] rounded-3xl overflow-hidden shadow-xl border-4 border-white bg-beige-200 relative group">
                                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=1200" alt="Quốc Võ" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-espresso-900/70 via-espresso-900/20 to-transparent"></div>
                                    <div className="absolute bottom-6 left-6 right-6 text-white flex items-center justify-between">
                                        <div>
                                            <p className="text-xs uppercase tracking-widest text-gold font-bold">Quốc Võ</p>
                                            <p className="text-lg font-bold">Videographer & Colorist</p>
                                        </div>
                                        <span className="text-xs bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-white font-medium">TP. Hồ Chí Minh</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Projects Gallery (Đẩy lên trên phần Kỹ năng & Phần mềm) */}
                    <section id="portfolio" className="py-16 px-6 max-w-7xl mx-auto border-t border-beige-200">
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6">
                            <div>
                                <span className="inline-block px-3 py-1 rounded-md bg-gold/10 text-gold text-xs font-bold uppercase tracking-wider mb-2">Showcase</span>
                                <h2 className="text-3xl md:text-4xl font-bold tracking-tight mb-2">Dự Án Tiêu Biểu</h2>
                                <p className="text-espresso-800/70 text-sm md:text-base">Tuyển tập các sản phẩm TVC, MV, Quảng cáo và Reels/TikTok.</p>
                            </div>
                            <div className="flex flex-wrap gap-2 bg-beige-200/60 p-1.5 rounded-2xl">
                                <button 
                                    onClick={() => setActiveCategory('All')} 
                                    className={`px-4 py-2 rounded-xl text-xs md:text-sm font-medium transition-all ${activeCategory === 'All' ? 'bg-espresso-900 text-beige-50 shadow-md' : 'text-espresso-900 hover:bg-beige-100'}`}
                                >
                                    Tất cả ({projects.length})
                                </button>
                                {categories.map((cat, idx) => {
                                    const count = projects.filter(p => p.category === cat).length;
                                    return (
                                        <button 
                                            key={idx} 
                                            onClick={() => setActiveCategory(cat)} 
                                            className={`px-4 py-2 rounded-xl text-xs md:text-sm font-medium transition-all ${activeCategory === cat ? 'bg-espresso-900 text-beige-50 shadow-md' : 'text-espresso-900 hover:bg-beige-100'}`}
                                        >
                                            {cat} ({count})
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {filteredProjects.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-2xl border border-beige-200">
                                <p className="text-espresso-800/60 text-sm">Chưa có video nào trong danh mục này.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
                                {filteredProjects.map((project) => (
                                    <div key={project.id} className="group bg-white rounded-2xl overflow-hidden border border-beige-200 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col">
                                        <div className="relative aspect-[16/9] overflow-hidden bg-beige-100 cursor-pointer" onClick={() => setSelectedProject(project)}>
                                            <img src={project.thumbnail} alt={project.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                            <div className="absolute inset-0 bg-espresso-900/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                <div className="w-14 h-14 rounded-full bg-gold text-white flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                                    <Icon name="play" className="w-6 h-6 fill-current" />
                                                </div>
                                            </div>
                                            <span className="absolute top-4 left-4 bg-espresso-900/80 text-beige-50 text-xs font-semibold px-3 py-1 rounded-full backdrop-blur-sm">{project.category}</span>
                                        </div>
                                        <div className="p-6 flex flex-col flex-grow justify-between">
                                            <div>
                                                <h3 className="text-xl font-bold mb-2 group-hover:text-gold transition-colors">{project.title}</h3>
                                                <p className="text-espresso-800/70 text-sm mb-4 leading-relaxed">{project.desc}</p>
                                            </div>
                                            <div className="flex items-center justify-between pt-4 border-t border-beige-100">
                                                <button onClick={() => setSelectedProject(project)} className="text-sm font-semibold text-gold flex items-center gap-1.5 hover:underline">
                                                    Xem video chi tiết <Icon name="arrow-right" className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </section>

                    {/* Skills & Software Section */}
                    <section id="skills" className="py-16 px-6 max-w-7xl mx-auto border-t border-beige-200">
                        <div className="mb-12 text-center max-w-2xl mx-auto">
                            <span className="inline-block px-3 py-1 rounded-md bg-gold/10 text-gold text-xs font-bold uppercase tracking-wider mb-2">Năng Lực Chuyên Môn</span>
                            <h2 className="text-3xl md:text-4xl font-bold tracking-tight mb-3">Kỹ Năng & Công Cụ Sản Xuất</h2>

                                                            <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="Mô tả..." className="w-full px-4 py-2 rounded-xl border text-sm h-16"></textarea>
                                                        </div>
                                                        <button type="submit" className="w-full py-3 rounded-xl bg-espresso-900 text-beige-50 font-semibold hover:bg-gold text-sm transition-colors">
                                                            {editingId ? 'Lưu Thay Đổi' : 'Đăng Dự Án Mới'}
                                                        </button>
                                                    </form>

                                                    {/* Danh sách dự án */}
                                                    <div className="bg-beige-50 p-6 rounded-2xl border">
                                                        <div className="flex justify-between items-center mb-3">
                                                            <h4 className="font-bold text-sm">Danh Sách Video ({projects.length})</h4>
                                                            <button onClick={() => { if(confirm('Reset tất cả dữ liệu về mặc định?')) { localStorage.clear(); location.reload(); } }} className="text-xs text-red-500 hover:underline">Reset toàn bộ dữ liệu</button>
                                                        </div>
                                                        <div className="space-y-2 max-h-48 overflow-y-auto">
                                                            {projects.map(p => (
                                                                <div key={p.id} className={`flex items-center justify-between p-2.5 rounded-xl border transition-colors ${editingId === p.id ? 'bg-amber-50 border-gold' : 'bg-white border-beige-200'}`}>
                                                                    <div className="flex items-center gap-2 min-w-0">
                                                                        <img src={p.thumbnail} className="w-8 h-8 rounded object-cover" />
                                                                        <div className="truncate">
                                                                            <p className="text-xs font-medium truncate">{p.title}</p>
                                                                            <span className="text-[10px] text-gold font-semibold">{p.category}</span>
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-3 shrink-0">
                                                                        <button onClick={() => handleEditClick(p)} className="text-gold hover:underline text-xs font-semibold">Sửa</button>
                                                                        <button onClick={() => deleteProject(p.id)} className="text-red-500 hover:text-red-700 text-xs font-semibold">Xóa</button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* TAB 2: QUẢN LÝ DANH MỤC VIDEO */}
                                            {activeCmsTab === 'categories' && (
                                                <div className="bg-beige-50 p-6 rounded-2xl border border-beige-200 space-y-4">
                                                    <h4 className="font-bold text-base text-gold flex items-center gap-2">
                                                        <Icon name="folder-plus" className="w-4 h-4" /> Tạo Danh Mục / List Video Mới
                                                    </h4>
                                                    
                                                    <form onSubmit={handleAddCategory} className="flex gap-2">
                                                        <input 
                                                            type="text" 
                                                            value={newCategoryInput} 
                                                            onChange={e => setNewCategoryInput(e.target.value)} 
                                                            placeholder="Tên danh mục mới (VD: Fashion, Event, Shorts)..." 
                                                            className="flex-grow px-4 py-2 rounded-xl border text-sm"
                                                        />
                                                        <button type="submit" className="px-5 py-2 bg-gold text-white font-semibold text-xs rounded-xl hover:bg-gold-light transition-colors shrink-0">
                                                            Thêm Danh Mục
                                                        </button>
                                                    </form>

                                                    <div className="pt-2">
                                                        <p className="text-xs font-semibold text-espresso-800/70 mb-2">Các danh mục hiện tại:</p>
                                                        <div className="flex flex-wrap gap-2">
                                                            {categories.map((cat, idx) => (
                                                                <span key={idx} className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-beige-300 text-xs font-medium shadow-sm">
                                                                    {cat}
                                                                    {categories.length > 1 && (
                                                                        <button 
                                                                            type="button" 
                                                                            onClick={() => handleDeleteCategory(cat)} 
                                                                            className="text-gray-400 hover:text-red-500 ml-1"
                                                                            title="Xóa danh mục"
                                                                        >
                                                                            <Icon name="x" className="w-3.5 h-3.5" />
                                                                        </button>
                                                                    )}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* TAB 3: QUẢN LÝ BEHIND THE SCENES (BTS) */}
                                            {activeCmsTab === 'bts' && (
                                                <div className="space-y-6">
                                                    <form onSubmit={handleSaveBts} className="space-y-4 bg-beige-50 p-6 rounded-2xl border border-beige-200">
                                                        <div className="flex justify-between items-center">
                                                            <h4 className="font-bold text-base text-gold flex items-center gap-2">
                                                                <Icon name="image" className="w-4 h-4" /> {editingBtsId ? 'Chỉnh Sửa Ảnh Hậu Trường' : 'Thêm Ảnh BTS Hậu Trường Mới'}
                                                            </h4>
                                                            {editingBtsId && (
                                                                <button type="button" onClick={resetBtsForm} className="text-xs text-gray-500 hover:underline">Hủy sửa (Thêm mới)</button>
                                                            )}
                                                        </div>

                                                        <div>
                                                            <label className="block text-xs font-semibold mb-1">Tiêu đề hình ảnh *</label>
                                                            <input type="text" value={btsTitle} onChange={e => setBtsTitle(e.target.value)} placeholder="Tác Nghiệp Bối Cảnh Studio..." className="w-full px-4 py-2 rounded-xl border text-sm" required />
                                                        </div>

                                                        <div className="grid grid-cols-2 gap-4">
                                                            <div>
                                                                <label className="block text-xs font-semibold mb-1">Nhãn / Phân loại (Không bắt buộc)</label>
                                                                <input type="text" value={btsCategory} onChange={e => setBtsCategory(e.target.value)} placeholder="Lighting & Setup, Color Grading..." className="w-full px-4 py-2 rounded-xl border text-sm" />
                                                            </div>
                                                            <div>
                                                                <label className="block text-xs font-semibold mb-1">
                                                                    {editingBtsId ? 'Thay ảnh BTS mới' : 'Chọn tệp hình ảnh BTS *'}
                                                                </label>
                                                                <input type="file" accept="image/*" onChange={handleBtsImageChange} className="w-full px-2 py-1.5 rounded-xl border text-xs bg-white file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-beige-200 file:font-semibold" required={!editingBtsId && !btsImageBase64} />
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <label className="block text-xs font-semibold mb-1">Mô tả chi tiết góc máy / quy trình</label>
                                                            <textarea value={btsDesc} onChange={e => setBtsDesc(e.target.value)} placeholder="Sử dụng hệ thống đèn Amaran & Aputure..." className="w-full px-4 py-2 rounded-xl border text-sm h-16"></textarea>
                                                        </div>

                                                        <button type="submit" className="w-full py-3 rounded-xl bg-espresso-900 text-beige-50 font-semibold hover:bg-gold text-sm transition-colors">
                                                            {editingBtsId ? 'Lưu Thay Đổi Ảnh BTS' : 'Tải Lên Ảnh Hậu Trường'}
                                                        </button>
                                                    </form>

                                                    {/* Danh sách BTS hiện có */}
                                                    <div className="bg-beige-50 p-6 rounded-2xl border">
                                                        <h4 className="font-bold text-sm mb-3">Tất Cả Ảnh Hậu Trường ({btsGalleries.length})</h4>
                                                        <div className="space-y-2 max-h-48 overflow-y-auto">
                                                            {btsGalleries.map(b => (
                                                                <div key={b.id} className={`flex items-center justify-between p-2.5 rounded-xl border transition-colors ${editingBtsId === b.id ? 'bg-amber-50 border-gold' : 'bg-white border-beige-200'}`}>
                                                                    <div className="flex items-center gap-2 min-w-0">
                                                                        <img src={b.image} className="w-8 h-8 rounded object-cover" />
                                                                        <div className="truncate">
                                                                            <p className="text-xs font-medium truncate">{b.title}</p>
                                                                            <span className="text-[10px] text-gold font-semibold">{b.category || 'BTS'}</span>
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-3 shrink-0">
                                                                        <button onClick={() => handleEditBtsClick(b)} className="text-gold hover:underline text-xs font-semibold">Sửa</button>
                                                                        <button onClick={() => deleteBts(b.id)} className="text-red-500 hover:text-red-700 text-xs font-semibold">Xóa</button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
