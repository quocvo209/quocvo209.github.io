<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quốc Võ Production | Portfolio & Videographer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: { 50: '#FAF7F2', 100: '#F3EFE6', 200: '#E8E1D3', 300: '#D6CBBA' },
                        espresso: { 800: '#2A2421', 900: '#1F1A17' },
                        gold: { DEFAULT: '#A37832', light: '#C49747' }

                        heading: ['Be Vietnam Pro', 'sans-serif'],
                    }
                }

        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAF7F2; color: #1F1A17; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-beige-50 text-espresso-900 antialiased selection:bg-gold selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} {...props}></i>;
        };

        const parseYoutubeUrl = (inputUrl) => {
            if (!inputUrl) return { embedUrl: '' };
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = inputUrl.match(regExp);
            if (match && match[2].length === 11) {
                const videoId = match[2];
                return {
                    embedUrl: `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1`
                };
            }
            return { embedUrl: inputUrl };
        };

        const asset = (p) => (p && p.startsWith('/') && !p.startsWith('//')) ? p.slice(1) : (p || '');

        const normalizeProject = (p, i) => {
            const m = (p.url || '').match(/(?:youtu\.be\/|embed\/|watch\?v=|&v=|v\/)([\w-]{11})/);
            return {
                id: i,
                title: p.title || '',
                category: p.category || 'Khác',
                desc: p.desc || '',
                url: parseYoutubeUrl(p.url).embedUrl,
                thumbnail: p.thumbnail ? asset(p.thumbnail) : (m ? `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` : '')
            };
        };

        const normalizeBts = (b, i) => ({
            id: i,
            title: b.title || '',
            category: b.category || 'Behind The Scenes',
            desc: b.desc || '',
            image: asset(b.image)
        });

        const loadData = (file, key) =>
            fetch(file, { cache: 'no-cache' })
                .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
                .then(d => Array.isArray(d[key]) ? d[key] : [])
                .catch(err => { console.warn('Không tải được ' + file, err); return []; });

        const defaultSite = {"hero": {"badge": "Video Editor & Videographer • 4 Năm Kinh Nghiệm", "title": "QUỐC VÕ PRODUCTION", "description": "Chuyên viên Quay - Dựng phim & Color Grading. Ứng dụng kỹ thuật dựng hiện đại kết hợp công nghệ AI tối ưu quy trình sản xuất hình ảnh.", "image": ""}, "about": {"badge": "Giới thiệu bản thân", "heading": "Kể Chuyện Bằng Hình Ảnh & Góc Máy Tinh Tế", "paragraph": "Chào bạn, mình là **Quốc Võ** — Videographer & Editor tại TP.HCM. Với hơn 4 năm làm việc trong lĩnh vực sản xuất nội dung video, mình tập trung vào việc biến ý tưởng thương hiệu thành những khung hình giàu cảm xúc và thu hút thị giác.", "stat1_number": "04+", "stat1_label": "Năm kinh nghiệm", "stat2_number": "100+", "stat2_label": "Dự án hoàn thành", "image": "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=1200", "image_name": "Quốc Võ", "image_role": "Videographer & Colorist", "image_location": "TP. Hồ Chí Minh"}, "contact": {"description": "Bạn có dự án mới cần tư vấn quay dựng hoặc chỉnh màu chuyên nghiệp? Hãy liên hệ trực tiếp với mình qua Zalo hoặc Facebook nhé.", "zalo_label": "Zalo: +84 707068508", "zalo_url": "https://zalo.me/84707068508", "facebook_label": "Facebook: Quốc Võ", "facebook_url": "https://www.facebook.com/quocvo20.09/"}};

        const renderBold = (t) => String(t || '').split(/\*\*(.+?)\*\*/g).map((x, i) => i % 2 ? <strong key={i}>{x}</strong> : x);

        function App() {
            const [projects, setProjects] = useState([]);
            const [btsGalleries, setBtsGalleries] = useState([]);
            const [activeCategory, setActiveCategory] = useState('All');
            const [selectedProject, setSelectedProject] = useState(null);
            const [selectedImage, setSelectedImage] = useState(null);
            const [site, setSite] = useState(defaultSite);

            useEffect(() => {
                loadData('data/projects.json', 'projects').then(list => setProjects(list.map(normalizeProject)));
                loadData('data/bts.json', 'bts').then(list => setBtsGalleries(list.map(normalizeBts)));
                fetch('data/site.json', { cache: 'no-cache' })
                    .then(r => r.ok ? r.json() : Promise.reject())
                    .then(d => setSite(prev => ({ hero: { ...prev.hero, ...d.hero }, about: { ...prev.about, ...d.about }, contact: { ...prev.contact, ...d.contact } })))
                    .catch(() => {});
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const categories = [...new Set(projects.map(p => p.category))];
            const filteredProjects = activeCategory === 'All'
                ? projects
                : projects.filter(p => p.category === activeCategory);

            return (
                <div className="min-h-screen bg-beige-50 text-espresso-900 selection:bg-gold selection:text-white">
                    {/* Header Nav */}
                    <header className="sticky top-0 z-40 bg-beige-50/80 backdrop-blur-md border-b border-beige-200">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <a href="#" className="text-xl md:text-2xl font-bold tracking-tight uppercase">
                                    QUỐC VÕ <span className="text-gold font-normal">PRODUCTION</span>
                                </a>
                                
                            </div>

                            <a href="#contact" className="inline-flex items-center gap-2 text-sm font-semibold px-5 py-2.5 rounded-full bg-espresso-900 text-beige-50 hover:bg-gold transition-colors">
                                <Icon name="phone" className="w-4 h-4" /> Liên hệ
                            </a>
                        </div>
                    </header>

                    {/* Hero Section */}
                    <section className="pt-16 pb-12 px-6 max-w-7xl mx-auto text-center">
                        <div className="inline-block mb-4 px-4 py-1.5 rounded-full bg-beige-200/60 text-gold text-xs md:text-sm font-semibold tracking-widest uppercase">
                            {site.hero.badge}
                        </div>
                        <h1 className="text-4xl md:text-6xl lg:text-7xl font-black tracking-tight max-w-5xl mx-auto leading-tight mb-6 uppercase">
                            {site.hero.title}
                        </h1>
                        <p className="text-base md:text-xl text-espresso-800/80 max-w-2xl mx-auto mb-6 leading-relaxed">
                            {site.hero.description}
                        </p>
                        {site.hero.image && (
                            <div className="mt-8 max-w-4xl mx-auto aspect-[16/9] sm:aspect-[21/9] rounded-3xl overflow-hidden shadow-xl border-4 border-white bg-beige-200">
                                <img src={asset(site.hero.image)} alt={site.hero.title} className="w-full h-full object-cover" />
                            </div>
                        )}
                    </section>

                    {/* About Me Section (Bố cục gọn: Nội dung dính liền phía trên hình ảnh) */}
                    <section id="about" className="py-12 px-6 max-w-4xl mx-auto border-t border-beige-200">
                        <div className="space-y-6">
                            {/* Nội dung giới thiệu */}
                            <div className="space-y-4 text-center sm:text-left">
                                <div className="inline-block px-3 py-1 rounded-md bg-gold/10 text-gold text-xs font-bold uppercase tracking-wider">
                                    {site.about.badge}
                                </div>
                                <h2 className="text-3xl md:text-4xl font-bold tracking-tight">{site.about.heading}</h2>
                                <p className="text-espresso-800/80 leading-relaxed">
                                    {renderBold(site.about.paragraph)}
                                </p>
                                
                                {/* Thống kê (Đã bỏ 4K/HDR) */}
                                <div className="grid grid-cols-2 gap-4 pt-2 max-w-md mx-auto sm:mx-0">
                                    <div className="p-4 rounded-2xl bg-white border border-beige-200 shadow-sm text-center">
                                        <h4 className="text-2xl font-black text-gold mb-1">{site.about.stat1_number}</h4>
                                        <p className="text-xs text-espresso-800/70 font-medium">{site.about.stat1_label}</p>
                                    </div>
                                    <div className="p-4 rounded-2xl bg-white border border-beige-200 shadow-sm text-center">
                                        <h4 className="text-2xl font-black text-gold mb-1">{site.about.stat2_number}</h4>
                                        <p className="text-xs text-espresso-800/70 font-medium">{site.about.stat2_label}</p>
                                    </div>
                                </div>
                            </div>

                            {/* Hình ảnh giới thiệu dính ngay bên dưới */}
                            <div className="pt-4">
                                <div className="aspect-[16/9] sm:aspect-[21/9] rounded-3xl overflow-hidden shadow-xl border-4 border-white bg-beige-200 relative group">
                                    <img src={asset(site.about.image)} alt={site.about.image_name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-espresso-900/70 via-espresso-900/20 to-transparent"></div>
                                    <div className="absolute bottom-6 left-6 right-6 text-white flex items-center justify-between">
                                        <div>
                                            <p className="text-xs uppercase tracking-widest text-gold font-bold">{site.about.image_name}</p>
                                            <p className="text-lg font-bold">{site.about.image_role}</p>
                                        </div>
                                        <span className="text-xs bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-white font-medium">{site.about.image_location}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Projects Gallery (Đẩy lên trên phần Kỹ năng & Phần mềm) */}
                    <section id="portfolio" className="py-16 px-6 max-w-7xl mx-auto border-t border-beige-200">
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-6">
                            <div>
                                <span className="inline-block px-3 py-1 rounded-md bg-gold/10 text-gold text-xs font-bold uppercase tracking-wider mb-2">Showcase</span>
                                <h2 className="text-3xl md:text-4xl font-bold tracking-tight mb-2">Dự Án Tiêu Biểu</h2>
                                <p className="text-espresso-800/70 text-sm md:text-base">Tuyển tập các sản phẩm TVC, MV, Quảng cáo và Reels/TikTok.</p>
                            </div>
                            <div className="flex flex-wrap gap-2 bg-beige-200/60 p-1.5 rounded-2xl">
                                <button 
                                    onClick={() => setActiveCategory('All')} 
                                    className={`px-4 py-2 rounded-xl text-xs md:text-sm font-medium transition-all ${activeCategory === 'All' ? 'bg-espresso-900 text-beige-50 shadow-md' : 'text-espresso-900 hover:bg-beige-100'}`}
                                >
                                    Tất cả ({projects.length})
                                </button>
                                {categories.map((cat, idx) => {
                                    const count = projects.filter(p => p.category === cat).length;
                                    return (
                                        <button 
                                            key={idx} 
                                            onClick={() => setActiveCategory(cat)} 
                                            className={`px-4 py-2 rounded-xl text-xs md:text-sm font-medium transition-all ${activeCategory === cat ? 'bg-espresso-900 text-beige-50 shadow-md' : 'text-espresso-900 hover:bg-beige-100'}`}
                                        >
                                            {cat} ({count})
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {filteredProjects.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-2xl border border-beige-200">
                                <p className="text-espresso-800/60 text-sm">Chưa có video nào trong danh mục này.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
                                {filteredProjects.map((project) => (
                                    <div key={project.id} className="group bg-white rounded-2xl overflow-hidden border border-beige-200 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col">
                                        <div className="relative aspect-[16/9] overflow-hidden bg-beige-100 cursor-pointer" onClick={() => setSelectedProject(project)}>
                                            <img src={project.thumbnail} alt={project.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                            <div className="absolute inset-0 bg-espresso-900/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                <div className="w-14 h-14 rounded-full bg-gold text-white flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                                    <Icon name="play" className="w-6 h-6 fill-current" />
                                                </div>
                                            </div>
                                            <span className="absolute top-4 left-4 bg-espresso-900/80 text-beige-50 text-xs font-semibold px-3 py-1 rounded-full backdrop-blur-sm">{project.category}</span>
                                        </div>
                                        <div className="p-6 flex flex-col flex-grow justify-between">
                                            <div>
                                                <h3 className="text-xl font-bold mb-2 group-hover:text-gold transition-colors">{project.title}</h3>
                                                <p className="text-espresso-800/70 text-sm mb-4 leading-relaxed">{project.desc}</p>
                                            </div>
                                            <div className="flex items-center justify-between pt-4 border-t border-beige-100">
                                                <button onClick={() => setSelectedProject(project)} className="text-sm font-semibold text-gold flex items-center gap-1.5 hover:underline">
                                                    Xem video chi tiết <Icon name="arrow-right" className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </section>

                    {/* Skills & Software Section */}
                    <section id="skills" className="py-16 px-6 max-w-7xl mx-auto border-t border-beige-200">
                        <div className="mb-12 text-center max-w-2xl mx-auto">
                            <span className="inline-block px-3 py-1 rounded-md bg-gold/10 text-gold text-xs font-bold uppercase tracking-wider mb-2">Năng Lực Chuyên Môn</span>
                            <h2 className="text-3xl md:text-4xl font-bold tracking-tight mb-3">Kỹ Năng & Công Cụ Sản Xuất</h2>
                            <p className="text-espresso-800/70 text-sm md:text-base">Sự kết hợp giữa tư duy nghệ thuật, phần mềm chuyên sâu và ứng dụng AI tối ưu hiệu suất.</p>
                        </div>

                        {/* Core Skills */}
                        <div className="mb-12">
                            <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                                <Icon name="video" className="text-gold w-5 h-5" /> Kỹ Năng Cốt Lõi
                            </h3>
                            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
                                {[
                                    { title: 'Quay Phim', icon: 'camera', desc: 'Bối cảnh, góc máy & ánh sáng cinematic' },
                                    { title: 'Dựng Phim', icon: 'scissors', desc: 'Nhịp điệu (Pacing), storytelling mượt mà' },
                                    { title: 'Color Grading', icon: 'palette', desc: 'Chỉnh màu chuyên sâu DaVinci / Tone da' },
                                    { title: 'Motion Graphic', icon: 'layers', desc: 'Hiệu ứng chữ, logo animation & visual' },
                                    { title: 'Storytelling', icon: 'book-open', desc: 'Kịch bản & tư duy phân cảnh thu hút' }
                                ].map((skill, i) => (
                                    <div key={i} className="p-5 bg-white rounded-2xl border border-beige-200 shadow-sm hover:shadow-md transition-all group">
                                        <div className="w-10 h-10 rounded-xl bg-beige-100 flex items-center justify-center text-gold mb-3 group-hover:bg-gold group-hover:text-white transition-colors">
                                            <Icon name={skill.icon} className="w-5 h-5" />
                                        </div>
                                        <h4 className="font-bold text-base mb-1">{skill.title}</h4>
                                        <p className="text-xs text-espresso-800/70 leading-relaxed">{skill.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Software & Tools */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            {/* Professional Software */}
                            <div className="lg:col-span-7">
                                <h3 className="text-xl font-bold mb-6 flex items-center gap-2">
                                    <Icon name="monitor" className="text-gold w-5 h-5" /> Phần Mềm Chuyên Dụng
                                </h3>
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                    {/* Premiere Pro */}
                                    <div className="p-4 bg-white rounded-2xl border border-beige-200 flex items-center gap-3.5 shadow-sm hover:border-gold transition-colors">
                                        <div className="w-11 h-11 rounded-xl bg-[#00005b] flex items-center justify-center text-[#9999ff] font-bold text-lg border border-[#333399]/40 shrink-0">Pr</div>
                                        <div>
                                            <h4 className="font-bold text-sm">Premiere Pro</h4>
                                            <p className="text-[11px] text-espresso-800/60">Dựng phim chính</p>
                                        </div>
                                    </div>

                                    {/* After Effects */}
                                    <div className="p-4 bg-white rounded-2xl border border-beige-200 flex items-center gap-3.5 shadow-sm hover:border-gold transition-colors">
                                        <div className="w-11 h-11 rounded-xl bg-[#00005b] flex items-center justify-center text-[#d67fff] font-bold text-lg border border-[#333399]/40 shrink-0">Ae</div>
                                        <div>
                                            <h4 className="font-bold text-sm">After Effects</h4>
                                            <p className="text-[11px] text-espresso-800/60">Motion Graphics</p>
                                        </div>
                                    </div>

                                    {/* DaVinci Resolve */}
                                    <div className="p-4 bg-white rounded-2xl border border-beige-200 flex items-center gap-3.5 shadow-sm hover:border-gold transition-colors">
                                        <div className="w-11 h-11 rounded-xl bg-gray-900 flex items-center justify-center p-2 border border-gray-700 shrink-0">
                                            <svg className="w-full h-full" viewBox="0 0 24 24" fill="none">
                                                <circle cx="7" cy="8" r="4" fill="#FF4B4B"/>
                                                <circle cx="17" cy="8" r="4" fill="#3B82F6"/>
                                                <circle cx="12" cy="16" r="4" fill="#10B981"/>
                                            </svg>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-sm">DaVinci Resolve</h4>
                                            <p className="text-[11px] text-espresso-800/60">Color Grading</p>
                                        </div>
                                    </div>

                                    {/* Photoshop */}
                                    <div className="p-4 bg-white rounded-2xl border border-beige-200 flex items-center gap-3.5 shadow-sm hover:border-gold transition-colors">
                                        <div className="w-11 h-11 rounded-xl bg-[#001e36] flex items-center justify-center text-[#31a8ff] font-bold text-lg border border-[#003366]/40 shrink-0">Ps</div>
                                        <div>
                                            <h4 className="font-bold text-sm">Photoshop</h4>
                                            <p className="text-[11px] text-espresso-800/60">Xử lý hình ảnh</p>
                                        </div>
                                    </div>

                                    {/* Lightroom */}
                                    <div className="p-4 bg-white rounded-2xl border border-beige-200 flex items-center gap-3.5 shadow-sm hover:border-gold transition-colors">
                                        <div className="w-11 h-11 rounded-xl bg-[#001e36] flex items-center justify-center text-[#31a8ff] font-bold text-lg border border-[#003366]/40 shrink-0">Lr</div>
                                        <div>
                                            <h4 className="font-bold text-sm">Lightroom</h4>
                                            <p className="text-[11px] text-espresso-800/60">Color Photo</p>
                                        </div>
                                    </div>

                                    {/* CapCut */}
                                    <div className="p-4 bg-white rounded-2xl border border-beige-200 flex items-center gap-3.5 shadow-sm hover:border-gold transition-colors">
                                        <div className="w-11 h-11 rounded-xl bg-black flex items-center justify-center shrink-0 border border-gray-800">
                                            <svg className="w-6 h-6 fill-white" viewBox="0 0 24 24">

                                            <h4 className="font-bold text-sm">CapCut Pro</h4>

                                <div className="space-y-4">
                                    {/* ChatGPT */}
                                    <div className="p-4 bg-white rounded-2xl border border-beige-200 flex items-center gap-4 shadow-sm hover:border-gold transition-colors">
                                        <div className="w-11 h-11 rounded-xl bg-[#10a37f] flex items-center justify-center text-white shrink-0 shadow-sm">
                                            <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24">
                                                <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0813 4.779-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4952 4.4952zm-10.15-5.3232a4.485 4.485 0 0 1-.5355-3.0031l.142.0833 4.779 2.7582a.7948.7948 0 0 0 .7928 0l5.8338-3.3692v2.3323a.071.071 0 0 1-.0334.0581l-4.8388 2.7937a4.504 4.504 0 0 1-6.14-1.6533zM2.84 8.7831a4.485 4.485 0 0 1 2.341-1.9623v5.682a.7948.7948 0 0 0 .3928.6813l5.8338 3.3692-2.02 1.1685a.071.071 0 0 1-.0678.0067L4.481 14.935A4.504 4.504 0 0 1 2.84 8.7831zm15.7027 3.7388l-5.8338-3.3692 2.02-1.1685a.071.071 0 0 1 .0678-.0067l4.8388 2.7937a4.504 4.504 0 0 1-1.0928 8.1517v-5.682a.7948.7948 0 0 0-.3928-.6813zm2.618-2.618a4.485 4.485 0 0 1 .5355 3.0031l-.142-.0833-4.779-2.7582a.7948.7948 0 0 0-.7928 0l-5.8338 3.3692V11.103a.071.071 0 0 1 .0334-.0581l4.8388-2.7937a4.504 4.504 0 0 1 6.14 1.6533z"/>
                                            </svg>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-sm">ChatGPT</h4>
                                            <p className="text-xs text-espresso-800/70">Lên ý tưởng kịch bản, outline góc quay & copywriting</p>
                                        </div>
                                    </div>

                                    {/* Claude AI */}
                                    <div className="p-4 bg-white rounded-2xl border border-beige-200 flex items-center gap-4 shadow-sm hover:border-gold transition-colors">
                                        <div className="w-11 h-11 rounded-xl bg-[#d97757] flex items-center justify-center text-white font-black text-xl shrink-0 shadow-sm">
                                            C
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-sm">Claude AI</h4>
                                            <p className="text-xs text-espresso-800/70">Phân tích storyline, biên tập kịch bản chiều sâu</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Behind the Scenes Section */}
                    <section id="behind-the-scenes" className="py-16 px-6 max-w-7xl mx-auto border-t border-beige-200">
                        <div className="mb-10 text-center max-w-2xl mx-auto">
                            <span className="inline-block px-3 py-1 rounded-md bg-gold/10 text-gold text-xs font-bold uppercase tracking-wider mb-2">Hậu Trường Tác Nghiệp</span>
                            <h2 className="text-3xl md:text-4xl font-bold tracking-tight mb-3">Behind The Scenes (BTS)</h2>
                            <p className="text-espresso-800/70 text-sm md:text-base">Góc nhìn chân thực từ quy trình chuẩn bị thiết bị, chiếu sáng cho tới quy trình dựng và Color Grading trong studio.</p>
                        </div>

                        {btsGalleries.length === 0 ? (
                            <div className="text-center py-12 bg-white rounded-2xl border border-beige-200">
                                <p className="text-espresso-800/60 text-sm">Chưa có hình ảnh hậu trường nào. Hãy thêm trong CMS!</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
                                {btsGalleries.map((item) => (
                                    <div key={item.id} className="bg-white rounded-2xl border border-beige-200 overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300 group cursor-pointer" onClick={() => setSelectedImage(item)}>
                                        <div className="aspect-[4/3] overflow-hidden bg-beige-100 relative">
                                            <img src={item.image} alt={item.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                            <div className="absolute inset-0 bg-espresso-900/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                <div className="w-10 h-10 rounded-full bg-white/90 text-espresso-900 flex items-center justify-center shadow-md">
                                                    <Icon name="maximize-2" className="w-5 h-5" />
                                                </div>
                                            </div>
                                        </div>
                                        <div className="p-5">
                                            {item.category && <span className="text-[10px] font-bold tracking-widest text-gold uppercase block mb-1">{item.category}</span>}
                                            <h3 className="font-bold text-lg mb-2 group-hover:text-gold transition-colors">{item.title}</h3>
                                            {item.desc && <p className="text-xs text-espresso-800/70 leading-relaxed">{item.desc}</p>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </section>

                    {/* Contact Section (Đã thêm nút Facebook) */}
                    <section id="contact" className="py-20 px-6 max-w-4xl mx-auto text-center border-t border-beige-200">
                        <h2 className="text-3xl md:text-4xl font-bold mb-4">Kết Nối Hợp Tác</h2>
                        <p className="text-espresso-800/70 mb-8 max-w-xl mx-auto">{site.contact.description}</p>
                        <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                            <a href={site.contact.zalo_url} target="_blank" rel="noopener noreferrer" className="w-full sm:w-auto inline-flex items-center justify-center gap-3 px-8 py-4 rounded-2xl bg-espresso-900 text-beige-50 font-semibold hover:bg-gold transition-all shadow-lg">
                                <Icon name="message-circle" className="w-5 h-5 text-gold" /> {site.contact.zalo_label}
                            </a>
                            <a href={site.contact.facebook_url} target="_blank" rel="noopener noreferrer" className="w-full sm:w-auto inline-flex items-center justify-center gap-3 px-8 py-4 rounded-2xl bg-[#1877F2] text-white font-semibold hover:bg-blue-700 transition-all shadow-lg">
                                <Icon name="facebook" className="w-5 h-5 text-white" /> {site.contact.facebook_label}
                            </a>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-8 border-t border-beige-200 text-center text-xs text-espresso-800/60">
                        <p>© {new Date().getFullYear()} Quốc Võ Production. All Rights Reserved.</p>
                    </footer>

                    {/* Video Player Modal */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 bg-espresso-900/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl overflow-hidden max-w-4xl w-full shadow-2xl border border-beige-200">
                                <div className="p-4 flex items-center justify-between border-b border-beige-200">
                                    <h3 className="font-bold text-lg">{selectedProject.title}</h3>
                                    <button onClick={() => setSelectedProject(null)} className="w-10 h-10 rounded-full bg-beige-100 flex items-center justify-center hover:bg-red-100 hover:text-red-600 transition-colors">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="aspect-[16/9] w-full bg-black">
                                    <iframe 
                                        src={selectedProject.url} 
                                        title={selectedProject.title} 
                                        className="w-full h-full border-0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                        referrerPolicy="strict-origin-when-cross-origin"
                                        allowFullScreen>
                                    </iframe>
                                </div>
                                <div className="p-6">
                                    <span className="inline-block px-3 py-1 rounded-full bg-beige-200 text-xs font-semibold mb-2">{selectedProject.category}</span>
                                    <p className="text-espresso-800/80 text-sm md:text-base">{selectedProject.desc}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BTS Image Modal */}
                    {selectedImage && (
                        <div className="fixed inset-0 z-50 bg-espresso-900/90 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setSelectedImage(null)}>
                            <div className="bg-white rounded-3xl overflow-hidden max-w-3xl w-full shadow-2xl border border-beige-200" onClick={e => e.stopPropagation()}>
                                <div className="p-4 flex items-center justify-between border-b border-beige-200">
                                    <div>
                                        <span className="text-[10px] font-bold tracking-widest text-gold uppercase block">{selectedImage.category}</span>
                                        <h3 className="font-bold text-base md:text-lg">{selectedImage.title}</h3>
                                    </div>
                                    <button onClick={() => setSelectedImage(null)} className="w-10 h-10 rounded-full bg-beige-100 flex items-center justify-center hover:bg-red-100 hover:text-red-600 transition-colors">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="max-h-[70vh] overflow-hidden bg-black flex items-center justify-center">
                                    <img src={selectedImage.image} alt={selectedImage.title} className="max-h-[70vh] w-auto object-contain" />
                                </div>
                                {selectedImage.desc && (
                                    <div className="p-5">
                                        <p className="text-espresso-800/80 text-sm leading-relaxed">{selectedImage.desc}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
