# Cấu hình Pages CMS cho Quốc Võ Production
# Đặt file này ở thư mục gốc của repo, tên chính xác là ".pages.yml"

media:
  input: assets/uploads        # nơi ảnh tải lên được lưu trong repo
  output: /assets/uploads      # đường dẫn ảnh khi hiển thị trên web

content:
  # ---------- THÔNG TIN WEBSITE (Hero, Giới thiệu, Liên hệ) ----------
  - name: site
    label: Thông tin website
    type: file
    path: data/site.json
    format: json
    fields:
      - name: hero
        label: Hero (đầu trang)
        type: object
        fields:
          - { name: badge, label: Dòng nhãn nhỏ phía trên, type: string }
          - { name: title, label: Tiêu đề lớn, type: string }
          - { name: description, label: Mô tả ngắn, type: text }
          - name: image
            label: Ảnh Hero (tùy chọn)
            type: image
            description: Để trống thì Hero chỉ hiển thị chữ như hiện tại
      - name: about
        label: Giới thiệu bản thân (About me)
        type: object
        fields:
          - { name: badge, label: Dòng nhãn nhỏ, type: string }
          - { name: heading, label: Tiêu đề, type: string }
          - name: paragraph
            label: Nội dung giới thiệu
            type: text
            description: Muốn in đậm thì đặt chữ giữa hai dấu **, ví dụ **Quốc Võ**
          - { name: stat1_number, label: Thống kê 1 - Con số, type: string }
          - { name: stat1_label, label: Thống kê 1 - Nhãn, type: string }
          - { name: stat2_number, label: Thống kê 2 - Con số, type: string }
          - { name: stat2_label, label: Thống kê 2 - Nhãn, type: string }
          - { name: image, label: Ảnh giới thiệu, type: image }
          - { name: image_name, label: Tên trên ảnh, type: string }
          - { name: image_role, label: Chức danh trên ảnh, type: string }
          - { name: image_location, label: Địa điểm trên ảnh, type: string }
      - name: contact
        label: Liên hệ
        type: object
        fields:
          - { name: description, label: Lời mời hợp tác, type: text }
          - { name: zalo_label, label: Chữ trên nút Zalo, type: string }
          - { name: zalo_url, label: Link Zalo, type: string }
          - { name: facebook_label, label: Chữ trên nút Facebook, type: string }
          - { name: facebook_url, label: Link Facebook, type: string }

  # ---------- VIDEO DỰ ÁN ----------
  # Cách thêm nhanh: dán nhiều link YouTube vào ô "Thêm NHIỀU video" (mỗi dòng 1 link).
  # Cần tên / mô tả / ảnh bìa riêng cho 1 video thì thêm vào "Danh sách video chi tiết".
  - name: projects
    label: Video dự án
    type: file
    path: data/projects.json
    format: json
    fields:
      - name: bulk_category
        label: "⚡ Thêm NHIỀU video - Danh mục chung"
        type: select
        options:
          values:
            - TVC/MV
            - Color Grading
            - Reels/TikTok
            - ADS
            - Bạch Ngọc Liên Socials
        description: Áp dụng cho mọi dòng bên dưới (dòng nào ghi danh mục riêng thì dùng danh mục đó).
      - name: bulk_links
        label: "⚡ Thêm NHIỀU video - Dán link YouTube (mỗi dòng 1 video)"
        type: text
        description: |
          Mỗi dòng 1 video. Có 3 cách viết:
          1) Chỉ link:  https://youtu.be/abc...  (web tự lấy tên và ảnh bìa từ YouTube)
          2) Tên | link:  MV Men nước mắt | https://youtu.be/abc...
          3) Tên | link | Danh mục:  Reels 01 | https://youtu.be/abc... | Reels/TikTok
          Muốn xoá video thì xoá dòng đó.
      - name: newest_first
        label: Video thêm sau cùng hiện lên ĐẦU trang
        type: boolean
        description: Bật lên thì video mới thêm (nằm cuối danh sách) sẽ hiện đầu tiên trên web. Tắt thì hiện đúng thứ tự trong CMS.
      - name: projects
        label: Danh sách video chi tiết (có tên, mô tả, ảnh bìa riêng)
        type: object
        list: true
        fields:
          - name: title
            label: Tên dự án
            type: string
            required: true
          - name: url
            label: Link YouTube
            type: string
            required: true
            description: Dán link dạng youtube.com/watch?v=... , youtu.be/... hoặc youtube.com/shorts/...
          - name: category
            label: Danh mục
            type: select
            required: true
            options:
              values:
                - TVC/MV
                - Color Grading
                - Reels/TikTok
                - ADS
                - Bạch Ngọc Liên Socials
            description: Muốn thêm danh mục mới thì thêm vào danh sách "values" trong file .pages.yml
          - name: thumbnail
            label: Ảnh thumbnail (JPG/PNG)
            type: image
            description: Có thể để trống, web sẽ tự lấy ảnh bìa từ YouTube
          - name: desc
            label: Mô tả
            type: text

  # ---------- HẬU TRƯỜNG (BTS) ----------
  # Mỗi ALBUM = 1 dự án / 1 buổi quay. Web chỉ hiện 1 ảnh đại diện; bấm vào mới xem các ảnh bên trong.
  - name: bts
    label: Hậu trường (BTS)
    type: file
    path: data/bts.json
    format: json
    fields:
      - name: albums
        label: Các album hậu trường (mỗi album = 1 dự án)
        type: object
        list: true
        fields:
          - name: title
            label: Tên album
            type: string
            required: true
            description: Ví dụ MV Men nước mắt
          - name: cover
            label: Ảnh đại diện (tùy chọn)
            type: image
            description: Để trống thì web tự dùng ảnh đầu tiên trong album.
          - name: images
            label: Ảnh trong album (chọn / kéo thả NHIỀU file JPG cùng lúc)
            type: image
            required: true
            options:
              multiple: true
            description: Bấm vào đây rồi chọn nhiều ảnh một lần (JPG, PNG, WEBP). Ảnh hiện theo thứ tự này; kéo để sắp xếp lại, bấm dấu x để xoá từng ảnh.
          - name: category
            label: Nhãn nhỏ phía trên tên (tùy chọn)
            type: string
            description: Ví dụ MV, TVC, Chụp ảnh
          - name: desc
            label: Mô tả ngắn (tùy chọn)
            type: text

  # ---------- ẢNH NỀN TRANG TRÍ ----------
  - name: backgrounds
    label: Ảnh nền trang trí
    type: file
    path: data/backgrounds.json
    format: json
    fields:
      - name: images
        label: Ảnh nền (chọn / tải nhiều ảnh cùng lúc)
        type: image
        options:
          multiple: true
        description: Ảnh sẽ hiện mờ nhẹ phía sau nội dung. Tải lên xong, mở web với đuôi ?edit (vd quocvo209.github.io/?edit) → tab "Ảnh nền" để kéo, đổi cỡ, xoay, chỉnh độ mờ từng ảnh.
